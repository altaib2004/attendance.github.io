<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Attendance & Credit Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen select-none">

    <!-- ==================== ADMIN LOGIN SCREEN ==================== -->
    <div id="loginOverlay" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl space-y-5">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            
            <div>
                <h1 class="text-xl font-bold text-white">Admin Authentication</h1>
                <p class="text-xs text-slate-400 mt-1">Enter credentials to unlock management portal</p>
            </div>

            <!-- Username & Password Inputs -->
            <div class="space-y-3">
                <input type="text" id="loginUsernameInput" placeholder="Admin Username" class="w-full bg-slate-950 border border-slate-800 text-xs text-white rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
                <input type="password" id="loginPasswordInput" placeholder="Admin Password" class="w-full bg-slate-950 border border-slate-800 text-xs text-white rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
                <p id="loginErrorMsg" class="text-xs text-rose-400 hidden font-medium">Invalid username or password.</p>
                <button id="btnLogin" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg cursor-pointer transition active:scale-95">
                    Unlock Dashboard
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== MAIN DASHBOARD ==================== -->
    <div id="appDashboard" class="hidden">
        
        <!-- Header Bar -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-id-card text-indigo-400 text-xl"></i>
                    <div>
                        <h1 class="font-bold text-base leading-tight text-white">Event Entry & Credits</h1>
                        <p class="text-xs text-slate-400 flex items-center gap-1">
                            <i class="fa-solid fa-lock text-emerald-400"></i> Secured Portal (£ GBP)
                        </p>
                    </div>
                </div>
                
                <button id="btnLogout" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 bg-rose-500/20 text-rose-300 border border-rose-500/30 cursor-pointer hover:bg-rose-500/30 transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Lock Session</span>
                </button>
            </div>
        </header>

        <!-- Main Container -->
        <main class="max-w-md mx-auto px-4 pt-4 pb-20">

            <!-- TAB NAVIGATION -->
            <div class="grid grid-cols-4 gap-1 bg-slate-900 p-1 rounded-xl mb-4 text-xs font-medium border border-slate-800">
                <button id="tab-scan" class="py-2.5 rounded-lg transition text-indigo-400 bg-slate-800 font-bold flex flex-col items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-qrcode text-base"></i> Scan ID
                </button>
                <button id="tab-directory" class="py-2.5 rounded-lg transition text-slate-400 hover:text-white flex flex-col items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-users text-base"></i> Members
                </button>
                <button id="tab-import" class="py-2.5 rounded-lg transition text-slate-400 hover:text-white flex flex-col items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-file-csv text-base"></i> Import
                </button>
                <button id="tab-logs" class="py-2.5 rounded-lg transition text-slate-400 hover:text-white flex flex-col items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-list-check text-base"></i> Activity Log
                </button>
            </div>

            <!-- ==================== TAB 1: LIVE BARCODE SCANNER ==================== -->
            <section id="view-scan" class="space-y-4">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-camera"></i> Live Barcode Reader
                        </span>
                        <button id="camToggleBtn" class="text-xs px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium cursor-pointer transition">
                            Start Camera
                        </button>
                    </div>

                    <!-- Video Viewport -->
                    <div id="reader-container" class="
